name: EvoWit
options:
  bundleIdPrefix: com.evowit
  createIntermediateGroups: true
packages: {}
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
schemes:
  EvoWit:
    build:
      targets:
        EvoWit: all
targets:
  EvoWit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - EvoWit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evowit.student
        INFOPLIST_FILE: EvoWit/Info.plist
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: EvoWit/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: Camera access is used to detect gaze focus and capture workbook content.
        NSMicrophoneUsageDescription: Microphone access is used for reading and speaking practice.
        NSSpeechRecognitionUsageDescription: Speech recognition is used to understand the student's reading.
        UIRequiredDeviceCapabilities:
          - arkit
          - front-facing-camera
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
